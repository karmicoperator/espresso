[project]
name = "espresso"
version = "0.1.0"
description = "Scrollable explainers with verified charts for open-access medical papers"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18", # UploadFile for POST /api/build/pdf
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Sources: PubMed Central (JATS over httpx + lxml) and reader-supplied PDFs
    "httpx>=0.27",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    # Model providers. claude_cli needs nothing installed here; azure uses the OpenAI SDK.
    "openai>=1.60",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "models", "ingestion", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["generated_output"]

[tool.ruff.lint]
# Correctness + hygiene set. Style-only churn (quotes, formatting) is left to
# the formatter; rules here catch real mistakes.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "DTZ", "PLW", "RUF"]
ignore = [
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "BLE001",  # pipeline gates intentionally catch broad exceptions (fail-open design)
  "SIM102",  # nested ifs are often clearer than compound conditions here
  "RUF012",  # class-level dict constants (prompt/example maps) are de facto frozen
  "PLW1510", # subprocess.run return codes are checked explicitly where they matter
  "UP042",   # (str, Enum) bases are shared with pydantic response models; churn > value
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]                  # load_dotenv() MUST run before app imports
# The provenance gate normalises publisher typography before matching, so its tables
# of dash, quote and space variants are the point of the file, not a mistake.
"agents/verify.py" = ["RUF001"]
