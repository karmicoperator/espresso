[project]
name = "medscroll"
version = "0.1.0"
description = "Scrollytelling explainers with Manim animations for open-access medical papers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "lxml>=5.3",
    "anthropic>=0.40",
    "manim>=0.18.1",
    "manim-voiceover[pyttsx3]>=0.3.7",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medscroll"]
