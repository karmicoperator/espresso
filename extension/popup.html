<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; width: 300px; background: #0b0b0b; color: #e8e8e8; font: 13px/1.5 -apple-system, "Inter", system-ui, sans-serif; }
      .wrap { padding: 14px 16px 16px; }
      h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      h1 img { width: 18px; height: 18px; }
      p { margin: 6px 0 0; color: rgba(255,255,255,0.55); }
      button { margin-top: 12px; width: 100%; padding: 9px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3);
               background: rgba(255,255,255,0.12); color: #e8e8e8; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: rgba(255,255,255,0.18); }
      button:disabled { opacity: 0.45; cursor: default; }
      .status { margin-top: 10px; min-height: 18px; font-size: 12px; color: rgba(255,255,255,0.7); }
      .status.err { color: #ff6259; }
      .status a { color: #5cff9e; }
      details { margin-top: 12px; }
      summary { cursor: pointer; color: rgba(255,255,255,0.4); font-size: 12px; }
      label { display: block; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.45); }
      input { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14);
              background: rgba(255,255,255,0.05); color: #e8e8e8; font: inherit; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><img src="icons/icon-32.png" alt="" /> Paper in Five</h1>
      <p id="what">Checking this page…</p>
      <button id="go" disabled>Explain this paper</button>
      <div id="status" class="status"></div>
      <details>
        <summary>Where the app runs</summary>
        <label>API <input id="api" placeholder="http://localhost:8000" /></label>
        <label>Web <input id="web" placeholder="http://localhost:3000" /></label>
      </details>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
